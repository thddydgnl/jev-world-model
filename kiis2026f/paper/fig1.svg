<svg xmlns="http://www.w3.org/2000/svg" width="330" height="134" viewBox="0 0 330 134" font-family="Helvetica, Arial, sans-serif" font-size="10">
<rect width="330" height="134" fill="white"/>
<rect x="4" y="3" width="322" height="29" rx="3" fill="#f4f4f4" stroke="#444" stroke-width="0.8"/>
<text x="10" y="14.5"><tspan font-weight="bold">State:</tspan> player in room A · apple on table · door locked</text>
<text x="10" y="26.5"><tspan font-weight="bold">Action:</tspan> take apple from table</text>
<rect x="4" y="36" width="159" height="94" rx="3" fill="#e8f0fa" stroke="#1f6fb4" stroke-width="0.8"/>
<rect x="167" y="36" width="159" height="94" rx="3" fill="#fbecea" stroke="#c8372d" stroke-width="0.8"/>
<text x="83.5" y="48" text-anchor="middle" font-weight="bold">Decision-style: JEV or LLM</text>
<text x="10" y="61">Q: Does the command execute?</text>
<text x="18" y="72">executes</text><rect x="61" y="66" width="42" height="6" fill="#1f6fb4"/>
<text x="112" y="72">fails</text><rect x="135" y="66" width="4" height="6" fill="#1f6fb4"/>
<text x="10" y="86">Q: Where is the apple then?</text>
<text x="18" y="97">inventory</text><rect x="64" y="91" width="42" height="6" fill="#1f6fb4"/>
<text x="112" y="97">on table</text><rect x="152" y="91" width="4" height="6" fill="#1f6fb4"/>
<text x="18" y="108">in box</text><rect x="49" y="102" width="3" height="6" fill="#1f6fb4"/>
<text x="60" y="108">on floor</text><rect x="99" y="102" width="3" height="6" fill="#1f6fb4"/>
<text x="112" y="108">eaten</text><rect x="140" y="102" width="3" height="6" fill="#1f6fb4"/>
<text x="10" y="123" font-size="9" font-style="italic">7 questions per action, fixed options</text>
<text x="246.5" y="48" text-anchor="middle" font-weight="bold">Generative: LLM</text>
<text x="173" y="61">Writes the next state as text:</text>
<g font-family="Menlo, Courier, monospace" font-size="9.2">
<text x="181" y="73">result: executes</text>
<text x="181" y="84">on(apple, table)</text>
<text x="181" y="95">in(apple, inventory)</text>
</g>
<text x="173" y="110" fill="#a02018" font-weight="bold">apple in two places →</text>
<text x="173" y="122" fill="#a02018">unparseable, counted as “fails”</text>
</svg>
